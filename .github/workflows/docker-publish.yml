name: Docker Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/bradwilson331/iron-hermes
permissions:
  contents: read
  packages: write
  # Keyless cosign signing: the OIDC token is used only by the cosign steps.
  # This workflow runs on `v*` tags and manual dispatch only (T-54.11-16);
  # the signing steps are further restricted to `v*` tag refs (WR-02).
  id-token: write
jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=MIT AND AGPL-3.0-only
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          # WR-01: push by digest ONLY; no tag exists until every gate has passed.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # D-22: opt-in dev-tools variant (git, gh, Node 22, pinned wrangler),
      # layered on the exact digest of the base image pushed above.
      - name: Dev-tools image metadata (tags + labels)
        id: meta_dev
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
          flavor: |
            suffix=-dev-tools,onlatest=true
          labels: |
            org.opencontainers.image.licenses=MIT AND AGPL-3.0-only
      - name: Build and push dev-tools variant (linux/amd64)
        id: build_dev
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/dev-tools.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            WRANGLER_VERSION=4.140.0
          labels: ${{ steps.meta_dev.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Release gates, in order. A digest that fails any of them stays unsigned
      # AND untagged: tags are only promoted (step 4) after everything passes.
      # 1. Dockle on both pushed digests.
      - name: Dockle lint (both digests)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEV: ${{ steps.build_dev.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMG}@${DIGEST}"
          docker pull "${IMG}@${DIGEST_DEV}"
          bash scripts/container-lint.sh --image "${IMG}@${DIGEST}"
          bash scripts/container-lint.sh --image "${IMG}@${DIGEST_DEV}"
      # 2. Real `docker compose up` smoke on rootful Linux Docker (D-03).
      #    ubuntu runners also ship podman and the harness prefers it, so the
      #    runtime is pinned and the log is checked: a compose_up SKIP or a
      #    podman run must not reach signing.
      - name: Hardened-container smoke (both digests, docker compose)
        shell: bash
        env:
          IH_SMOKE_RT: docker
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEV: ${{ steps.build_dev.outputs.digest }}
        run: |
          set -o pipefail
          IRONHERMES_IMAGE="${IMG}@${DIGEST}" \
          IRONHERMES_DEVTOOLS_IMAGE="${IMG}@${DIGEST_DEV}" \
            bash scripts/tests/container_hardened_smoke.sh | tee smoke.log
          grep -qE '^INFO runtime=docker$' smoke.log
          grep -qE '^PASS compose_up$' smoke.log
      # 3. Sign (keyless, by digest), then verify what was signed. WR-02: signing,
      #    verification and tag promotion run ONLY for `v*` tag pushes. A manual
      #    dispatch (any branch) is a gates-only dry run: it never signs, so no
      #    branch-built digest can carry a release identity, and it never tags.
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          cosign-release: v3.1.3
      - name: Sign both digests (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEV: ${{ steps.build_dev.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMG}@${DIGEST}"
          cosign sign --yes "${IMG}@${DIGEST_DEV}"
      - name: Verify signatures
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEV: ${{ steps.build_dev.outputs.digest }}
          IDENTITY_RE: ^https://github\.com/${{ github.repository }}/\.github/workflows/docker-publish\.yml@refs/tags/v.*$
        run: |
          set -euo pipefail
          for ref in "${IMG}@${DIGEST}" "${IMG}@${DIGEST_DEV}"; do
            cosign verify "${ref}" \
              --certificate-identity-regexp "${IDENTITY_RE}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      # 4. Promote: only now do `latest` / version tags point at the digests, and
      #    both are already signed and verified. Tag lists come from the
      #    metadata steps above (imagetools copies the manifest, same digest).
      - name: Promote tags (after all gates)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEV: ${{ steps.build_dev.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          TAGS_DEV: ${{ steps.meta_dev.outputs.tags }}
        run: |
          set -euo pipefail
          promote() { # promote DIGEST TAGS
            local digest="$1" tags="$2" t
            local args=()
            while IFS= read -r t; do
              if [ -n "$t" ]; then args+=(-t "$t"); fi
            done <<<"$tags"
            docker buildx imagetools create "${args[@]}" "${IMG}@${digest}"
          }
          promote "${DIGEST}" "${TAGS}"
          promote "${DIGEST_DEV}" "${TAGS_DEV}"
