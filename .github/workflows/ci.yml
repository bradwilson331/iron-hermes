name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Phase 21.7 gate — static-grep + cargo-test CI gates that lock the four
  # AI-SPEC eval invariants (E-05 SeqCst, E-08 transcript no-unwrap,
  # E-09 three-site wiring parity, D-12 no per-request yolo).
  # ---------------------------------------------------------------------------
  phase-21-7-gates:
    name: Phase 21.7 CI gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libudev-dev

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Run scripts/ci-gates.sh
        run: bash scripts/ci-gates.sh

  # ---------------------------------------------------------------------------
  # Insta workspace snapshot gate — blocks merges that leave orphan .snap
  # files in the repo (the `--unreferenced=reject` flag) and ensures every
  # committed snapshot still matches the producing code.
  # ---------------------------------------------------------------------------
  insta-snapshots:
    name: insta snapshots up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libudev-dev

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-insta
        run: cargo install cargo-insta --locked

      - name: cargo insta test (reject unreferenced)
        # Scoped to ironhermes-cli: every committed .snap lives in
        # crates/ironhermes-cli/tests/snapshots, so the orphan check
        # (--unreferenced=reject) only needs that crate. The workspace nextest
        # job already runs every snapshot ASSERTION across all crates (so
        # mismatches are caught everywhere); this job's unique job is orphan
        # detection over the snapshot-owning crate.
        #
        # Why not --workspace here: cargo-insta's default cargo-test runner runs
        # a binary's tests as in-process threads, which breaks tests written for
        # nextest's per-process isolation — HERMES_KANBAN_DB env handoff in
        # ironhermes-kanban, the ironhermes-agent budget-concurrency stress test,
        # etc. (all green under the nextest job). Scoping to the cli sidesteps
        # them. --all-features enables cli's `test-support` feature, which gates
        # tui_rata_snapshots.rs (its 8 snapshots) — without it they orphan.
        run: cargo insta test --unreferenced=reject -p ironhermes-cli --all-features

  # ---------------------------------------------------------------------------
  # Full workspace test — catches regressions across every crate.
  # ---------------------------------------------------------------------------
  workspace-tests:
    name: cargo nextest run --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libudev-dev

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run --workspace
        run: cargo nextest run --no-fail-fast --workspace --all-features

      # nextest does not run doctests — keep them covered separately.
      - name: cargo test --doc
        run: cargo test --workspace --all-features --doc

  # ---------------------------------------------------------------------------
  # Lint + format — workspace hygiene; regression gates outside the phase
  # focus but cheap to run.
  # ---------------------------------------------------------------------------
  lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable) with components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libudev-dev

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
