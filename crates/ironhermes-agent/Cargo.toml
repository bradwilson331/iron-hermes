[package]
name = "ironhermes-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent loop and LLM client for IronHermes"

[features]
memory-sqlite = ["dep:memory-sqlite"]
memory-duckdb = ["dep:memory-duckdb"]
memory-grafeo = ["dep:memory-grafeo"]
test-support = []
# Phase 46.8 Plan 07 (D-07): threads the RustyVault backend into the vault
# fallback consulted at resolver-construction sites. Off by default —
# env-var backend (always-on, no cargo feature required) remains the default.
rusty-vault = ["ironhermes-vault/rusty-vault"]

[dependencies]
ironhermes-core = { path = "../ironhermes-core" }
# Phase 46.8 Plan 07 (D-07): subagent_runner's resolver-construction site
# (test-only — production subagents inherit the parent's already-vault-topped-up
# resolver via clone, per D-13) applies the same guarded vault fallback.
ironhermes-vault = { path = "../ironhermes-vault" }
ironhermes-blackbox = { path = "../ironhermes-blackbox" }
ironhermes-tools = { path = "../ironhermes-tools" }
ironhermes-state = { path = "../ironhermes-state" }
ironhermes-hooks = { path = "../ironhermes-hooks" }
ironhermes-cron = { path = "../ironhermes-cron" }
ironhermes-exec = { path = "../ironhermes-exec" }
ironhermes-mcp = { path = "../ironhermes-mcp" }
ironhermes-trajectory = { path = "../ironhermes-trajectory" }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
# Phase 36.2 Plan 07: per-turn usage_events INSERT + sessions UPDATE inside a
# single rusqlite unchecked_transaction. The transaction borrows
# `&rusqlite::Connection` so the writes use `tx.execute(...)` directly instead
# of the `&mut self` methods on `StateStore` (mirrors the b7_* atomicity tests
# in ironhermes-state).
rusqlite = { workspace = true }
memory-sqlite = { path = "../../providers/memory-sqlite", optional = true }
memory-grafeo = { path = "../../providers/memory-grafeo", optional = true }
memory-duckdb = { path = "../../providers/memory-duckdb", optional = true }

[dev-dependencies]
tempfile = "3"
# Phase 21.7 Wave 0 — BudgetHandle + transcript + pressure tests
tracing-test = { workspace = true }
insta = { workspace = true }
# Phase 25.1 GAP-7 — pre-send invariant integration tests
wiremock = { workspace = true }
# Phase 36.17.7 Plan 01 — async behavioral tests for tts_per_turn_wiring
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
