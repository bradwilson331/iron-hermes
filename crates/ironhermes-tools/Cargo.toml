[package]
name = "ironhermes-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tool registry and implementations for IronHermes"

[dependencies]
ironhermes-core = { path = "../ironhermes-core" }
ironhermes-hub = { path = "../ironhermes-hub" }
ironhermes-cron = { path = "../ironhermes-cron" }
ironhermes-hooks = { path = "../ironhermes-hooks" }
ironhermes-exec = { path = "../ironhermes-exec" }
ironhermes-artifacts = { path = "../ironhermes-artifacts" } # Phase 46.6 D-01/D-03
# Phase 41.3 D-19: leaf-crate dep, zero-cycle (ironhermes-vault has no dependency
# on ironhermes-tools) — see credentials.rs for the resolution seam.
ironhermes-vault = { path = "../ironhermes-vault" }
secrecy = { version = "0.10.3", features = ["serde"] } # Phase 41.3 D-19 credential snapshot
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }                          # Phase 25.1 D-01 / browser_vision
chromiumoxide = { version = "0.9", features = [] }     # Phase 25.1 D-01
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }                            # 52.1-08 D-12 — pointer-artifact digest
scraper = { workspace = true }
htmd = { workspace = true }
pdf-extract = { workspace = true }                     # Phase 25.2 D-09 PDF local fallback (workspace pins 0.10)
url = { workspace = true }                             # Phase 25.2 D-03 URL classifier (dispatch.rs)
tokio-util = { workspace = true }
tempfile = "3"
msedge-tts = { workspace = true }   # Phase 36.17.5 D-03 / Edge TTS
rodio = { workspace = true }        # Phase 36.17.5 D-15 Local arm
rustls = "0.23"
cpal = "0.18.1"                     # Phase 36.17.8 D-08 — mic capture backend
hound = "3.5.1"                     # Phase 36.17.8 D-08 — WAV read/write for STT
# Phase 49.8 D-01: rosbridge WebSocket transport for the `ros2` toolset. Already
# resolved at exactly this version via ironhermes-gateway's own dep on the same
# crate (Cargo.lock) — adds no new package to the dependency graph.
tokio-tungstenite = "0.28"
# Phase 49.8 D-13 (49.8-06): sensor_msgs Image/CompressedImage -> JPEG data URL
# conversion for the ros2 camera vision path. Already resolved at 0.25.10 via
# ironhermes-gateway (Cargo.toml:50) and ironhermes-cli (Cargo.toml:84) —
# planner-verified [VERIFIED], adds no new package to the dependency graph.
# Feature subset (jpeg/png) matches the two CompressedImage formats this
# module supports.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Phase 53 Plan 03 Task 1: SIGTERM for a locally-spawned `obscura serve` child in
# BrowserSession::close()'s per-mode teardown (SIGTERM -> bounded grace ->
# Child::start_kill() hard kill). `signal` feature needed for kill()/Signal;
# `process` feature needed for this task's own tests (nix::sys::wait::waitpid,
# used to reap+assert termination rather than reading a not-yet-reaped
# zombie via kill(pid, 0)). `nix` is an existing workspace dependency
# (Cargo.toml:149, pulled in transitively via ironhermes-exec today) — not a
# new third-party package. Mirrors crates/ironhermes-kanban/Cargo.toml:31,
# plus the `process` feature this crate's own tests additionally need.
nix = { workspace = true, features = ["signal", "process"] }
[dev-dependencies]
# Phase 21.7 Plan 08 Task 8-03: tracing-test with `no-env-filter` so
# `#[traced_test]` captures logs from any target (not just the test
# binary crate). Required because the production warn target is
# `ironhermes_tools::delegate_task`, which would otherwise be filtered
# out by the default `{crate}=trace` env filter.
tracing-test = { workspace = true, features = ["no-env-filter"] }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
# Phase 49.8-20 (CR-03): documented tracing_subscriber::fmt() global
# subscriber for ros2_bridge_log_hygiene.rs's log-capture proofs. Already the
# workspace's own pinned dependency (root Cargo.toml, tracing-subscriber =
# "0.3") and already resolved in Cargo.lock as a transitive dev-dependency
# via tracing-test — adds no new package to the dependency graph.
tracing-subscriber = { workspace = true }
# Phase 36.17.5 TTS-10: install rustls CryptoProvider before live Edge TTS network call.
# msedge-tts tokio-runtime uses rustls 0.23 + aws-lc-rs; provider must be installed once
# per process before any TLS connection attempt.
rustls = "0.23"

[features]
