[package]
name = "ironhermes-kanban"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kanban work-queue kernel for IronHermes (Phase 36.3.7)"

[dependencies]
ironhermes-core = { path = "../ironhermes-core" }
ironhermes-tools = { path = "../ironhermes-tools" }
# Phase 46.6 gap-closure (D-01/D-04): worker artifact-store redirect. Provides
# ARTIFACTS_DB_ENV + default_db_path() so build_kanban_worker_env can point a
# worker's artifact store at the ROOT store (mirrors the IRONHERMES_KANBAN_DB
# board redirect). Native-only crate; kanban is native-only too.
ironhermes-artifacts = { path = "../ironhermes-artifacts" }
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# Phase 36.3.7 Plan 01 Task 0 decision (recorded in SUMMARY): nix for PID-liveness.
# Errno-discriminating is_pid_alive() needs `signal` feature (kill + Errno).
# nix is already used by ironhermes-gateway; no new workspace dep introduced.
nix = { workspace = true, features = ["signal"] }
regex = { workspace = true }
# Phase 36.3.7.9 Plan 05: notifier.toml subscribe_boards parser (D-03)
toml = { workspace = true }
# Phase 51 Plan 07 (D-11): WorkerVaultBootstrap carries the minted token as a
# secrecy::SecretString, never a plain String — same pinned version as
# ironhermes-vault/ironhermes-core/ironhermes-cli so the type unifies across crates.
secrecy = { version = "0.10.3", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
# Plan 01 Task 2: config.rs unit tests parse a YAML snippet.
serde_yaml = { workspace = true }
# Phase 51 Plan 07 (D-07): dispatcher.rs's `vault_mint_tests` module (gated on this
# crate's own `rusty-vault` feature) drives a REAL vault directly to prove the
# mint-then-ledger-then-spawn ordering, the no-sink refusal, and the Allow-vs-
# AllowFromVault split — a stubbed mint would only prove the stub was honoured.
# TEST-ONLY: ironhermes-kanban still has NO PRODUCTION dependency on ironhermes-vault
# (see profile_token.rs's module doc in that crate and 51-06-SUMMARY.md's own record
# of the same constraint) — this is a dev-dependency exception, disclosed as a
# deviation in 51-07-SUMMARY.md.
ironhermes-vault = { path = "../ironhermes-vault", features = ["rusty-vault"] }

[features]
# Phase 51 Plan 06: this crate has no [features] block before this line and depends on neither
# ironhermes-vault nor ironhermes-trajectory (see profile_token.rs's module doc in
# ironhermes-vault) — forwarding, not a direct dependency, so `--all-features` here actually
# exercises DispatcherContext's real profile-credential-endpoint path via ironhermes-core's own
# facade rather than silently compiling the feature-absent arm.
rusty-vault = ["ironhermes-core/rusty-vault"]
