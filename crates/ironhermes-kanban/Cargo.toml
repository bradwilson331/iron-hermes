[package]
name = "ironhermes-kanban"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kanban work-queue kernel for IronHermes (Phase 36.3.7)"

[dependencies]
ironhermes-core = { path = "../ironhermes-core" }
ironhermes-tools = { path = "../ironhermes-tools" }
# Phase 46.6 gap-closure (D-01/D-04): worker artifact-store redirect. Provides
# ARTIFACTS_DB_ENV + default_db_path() so build_kanban_worker_env can point a
# worker's artifact store at the ROOT store (mirrors the IRONHERMES_KANBAN_DB
# board redirect). Native-only crate; kanban is native-only too.
ironhermes-artifacts = { path = "../ironhermes-artifacts" }
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# Phase 36.3.7 Plan 01 Task 0 decision (recorded in SUMMARY): nix for PID-liveness.
# Errno-discriminating is_pid_alive() needs `signal` feature (kill + Errno).
# nix is already used by ironhermes-gateway; no new workspace dep introduced.
nix = { workspace = true, features = ["signal"] }
regex = { workspace = true }
# Phase 36.3.7.9 Plan 05: notifier.toml subscribe_boards parser (D-03)
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Plan 01 Task 2: config.rs unit tests parse a YAML snippet.
serde_yaml = { workspace = true }
